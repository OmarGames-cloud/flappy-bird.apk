<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(#55cfff, #dff8ff);
    text-align: center;
}

.box {
    width: 90%;
    max-width: 420px;
    padding: 45px 25px;
    background: white;
    border-radius: 25px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.2);
}

h1 {
    margin: 0;
    font-size: 55px;
}

.bird {
    font-size: 80px;
    margin: 20px 0;
}

p {
    font-size: 18px;
    color: #555;
}

.download {
    display: inline-block;
    margin-top: 15px;
    padding: 18px 30px;
    background: #222;
    color: white;
    border-radius: 15px;
    text-decoration: none;
    font-size: 19px;
    font-weight: bold;
}

.download:active {
    transform: scale(0.96);
}

.version {
    margin-top: 20px;
    color: #888;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="box">
    <h1>FLAPPY</h1>

    <div class="bird">🐦</div>

    <p>Flappy Bird'i telefonuna indir!</p>

    <a class="download" href="flappy-bird.apk" download>
        📱 APK'Yİ İNDİR
    </a>

    <div class="version">
        Sürüm 1.0
    </div>
</div>

</body>
</html>
